name: Backtest regression

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backtest
        run: python backtest.py

      - name: Build report outputs
        run: python make_report.py

      - name: Verify reconciliation and artifacts
        run: python ci_verify.py
